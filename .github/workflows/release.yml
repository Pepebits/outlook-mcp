name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
      chat:
        type: choice
        options: [test, announcements]
        default: test
      dry_run:
        type: boolean
        default: true

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Stages the version on npm; a maintainer approves it on npmjs.com (2FA),
      # then runs this workflow by hand to announce it.
      - name: Stage npm release (Trusted Publishing)
        run: |
          npm install -g npm@latest
          name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish"
          else
            npm stage publish . --provenance --access public
          fi
      - name: Create GitHub release from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" \
            --notes-file notes.md

  # Waits until the staged npm version has been approved on npmjs.com, so the
  # announcement never points at a version that cannot be installed yet. On a tag
  # push it polls for up to ~5h50m (GitHub's job limit is 6h); when run by hand it
  # checks once.
  wait-npm:
    needs: release
    if: always() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Wait for the npm version to be installable
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          ATTEMPTS: ${{ github.event_name == 'workflow_dispatch' && '1' || '345' }}
        run: |
          name=$(node -p "require('./package.json').name")
          version="${TAG#v}"
          for i in $(seq 1 "$ATTEMPTS"); do
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is on npm"
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              echo "Waiting for $name@$version to be approved on npmjs.com ($i/$ATTEMPTS)"
              sleep 60
            fi
          done
          echo "::error::$name@$version is not on npm. Approve the staged release on npmjs.com, then run this workflow by hand to announce it."
          exit 1

  # Lists the approved version in the official MCP Registry (metadata only).
  mcp-registry:
    needs: wait-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  announce:
    needs: wait-npm
    permissions:
      contents: read
    uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      chat: ${{ inputs.chat || 'announcements' }}
      dry_run: ${{ inputs.dry_run || false }}
      notes_source: changelog
      install_title: 🤖 Claude Code · Codex
      install_command: |-
        # Claude Code
        claude mcp add outlook --scope user -- npx -y @pepebits/outlook-mcp@{version}
        # Codex
        codex mcp add outlook -- npx -y @pepebits/outlook-mcp@{version}
      buttons: >-
        [{"text": "📝 Changelog", "url": "{repo_url}/blob/{tag}/CHANGELOG.md"},
         {"text": "📖 Setup guide", "url": "{repo_url}/blob/{tag}/README.md"},
         {"text": "📦 npm", "url": "https://www.npmjs.com/package/@pepebits/outlook-mcp/v/{version}"}]
    secrets: inherit

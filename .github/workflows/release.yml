name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        required: true
      chat:
        type: choice
        options: [test, announcements]
        default: test
      dry_run:
        type: boolean
        default: true

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Stages the version on npm; a maintainer approves it on npmjs.com (2FA),
      # then runs this workflow by hand to announce it.
      - name: Stage npm release (Trusted Publishing)
        run: |
          npm install -g npm@latest
          name=$(node -p "require('./package.json').name")
          version="${GITHUB_REF_NAME#v}"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version is already on npm; skipping publish"
          else
            npm stage publish . --provenance --access public
          fi
      - name: Create GitHub release from the annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")" \
            --notes-file notes.md

  # Runs only by hand, after the staged npm version has been approved.
  check-npm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Check that the version is installable from npm
        run: |
          name=$(node -p "require('./package.json').name")
          version="${INPUT_TAG#v}"
          if ! npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is not on npm yet. Approve the staged release on npmjs.com first."
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

  announce:
    needs: check-npm
    permissions:
      contents: read
    uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      chat: ${{ inputs.chat || 'announcements' }}
      dry_run: ${{ inputs.dry_run || false }}
      notes_source: changelog
      install_title: 🤖 Claude Code
      install_command: claude mcp add outlook --scope user -- npx -y @pepebits/outlook-mcp@{version}
      buttons: >-
        [{"text": "📝 Changelog", "url": "{repo_url}/blob/{tag}/CHANGELOG.md"},
         {"text": "📖 Setup guide", "url": "{repo_url}/blob/{tag}/README.md"},
         {"text": "📦 npm", "url": "https://www.npmjs.com/package/@pepebits/outlook-mcp/v/{version}"}]
    secrets: inherit
